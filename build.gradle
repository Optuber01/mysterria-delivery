plugins {
    id 'java'
    id('com.gradleup.shadow') version '9.4.1'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'net.mysterria'
version = '1.0.1'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://nexus.mysterria.net/repository/plugin-public/' }
}

dependencies {
    compileOnly("io.javalin:javalin-bundle:6.6.0")
    compileOnly 'io.swagger.core.v3:swagger-annotations:2.2.21'
    compileOnly("io.javalin.community.openapi:javalin-openapi-plugin:6.6.0")
    compileOnly("io.javalin.community.openapi:javalin-swagger-plugin:6.6.0")
    compileOnly("com.github.ikeepcalm:catwalk:v.0.8")
    implementation 'dev.ua.ikeepcalm.mysterria:audit-client:1.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    compileOnly 'net.luckperms:api:5.4'
    annotationProcessor("io.javalin.community.openapi:openapi-annotation-processor:6.6.0")
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}

tasks.build.dependsOn tasks.shadowJar

shadowJar {
    archiveClassifier.set('')
    relocate 'dev.ua.ikeepcalm.mysterria.audit', 'net.mysterria.delivery.libs.audit'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
